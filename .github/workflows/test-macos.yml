# This is a basic workflow to help you get started with Actions

name: macos

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    # runs-on: macos-15
    runs-on: xcode-27
    # env:
      # DEVELOPER_DIR: /Applications/Xcode_26.6.app

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: xbmc/xbmc
          # ref: ios-build-fixes

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          # brew install autoconf m4
          # brew rm --ignore-dependencies autoconf m4 libtool

          cd tools/depends
          # PATH="$(brew --prefix autoconf)/bin:$(brew --prefix m4)/bin:$PATH" ./bootstrap
          ./bootstrap
          # ./configure --host=$(uname -m)-apple-darwin --with-platform=macos --disable-ccache
          ./configure --host=aarch64-apple-darwin --with-platform=ios --disable-ccache
          make -j$(sysctl -n hw.ncpu) -C native

          # pipx install conan
          # conan profile detect
          # conan install --requires qt/5.15.19 \
          #   -o 'qt/*:opengl=es2' -o 'qt/*:with_mysql=False' -o 'qt/*:with_odbc=False' -o 'qt/*:with_openal=False' -o 'qt/*:with_pq=False' \
          #   -b missing -s os=iOS -s os.sdk=iphoneos -s os.version=15.0 -s arch=armv8 -of 1

      - name: target
        run: |
          cd tools/depends
          make -j$(sysctl -n hw.ncpu) -C target gettext
          make -j$(sysctl -n hw.ncpu) -C target

      - name: ffmpeg
        run: |
          cd tools/depends
          buildDir='${{ runner.temp }}/build'
          make -C target/cmakebuildsys BUILD_DIR="$buildDir"
          cd "$buildDir"
          xcodebuild -scheme build-ffmpeg

      # - uses: actions/upload-artifact@v7
      #   with:
      #     name: qt-ios
      #     path: ~/.conan2/p/b/qt*
